<head>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: radial-gradient(ellipse at top, #38200f 0%, #160e0b 45%, #080707 100%);
    color: #f5dfaa;
    font-family: Georgia, 'Times New Roman', serif;
    text-align: center;
    overflow-x: hidden;
}

/* CABEÇALHO CENTRALIZADO */

header {
    width: 100%;
    padding: 24px 15px 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
}

header h1 {
    width: 100%;
    max-width: 500px;
    color: #e8bd62;
    font-size: clamp(25px, 6vw, 43px);
    letter-spacing: 3px;
    line-height: 1.2;
    text-align: center;
    text-shadow: 0 0 15px #b77a24;
    margin: 0 auto;
}

header .subtitulo {
    width: 100%;
    margin-top: 9px;
    font-size: clamp(15px, 3.8vw, 22px);
    letter-spacing: 3px;
    color: #fff0c5;
    text-align: center;
}

.linha {
    width: 160px;
    height: 2px;
    background: linear-gradient(to right, transparent, #d6a54e, transparent);
    margin: 17px auto;
}

/* CONTEÚDO */

.container {
    width: 100%;
    max-width: 600px;
    margin: auto;
    padding: 5px 18px 35px;
}

.instrucao {
    font-size: 16px;
    color: #e6c98f;
    margin: 8px 0 20px;
    line-height: 1.6;
}

/* CARTA MENOR */

.area-carta {
    perspective: 1200px;
    width: min(60vw, 225px);
    height: min(88vw, 345px);
    max-height: 345px;
    margin: 0 auto 22px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
}

.carta {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transition: transform 1s ease;
}

.carta.virada {
    transform: rotateY(180deg);
}

.lado {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border-radius: 12px;
    overflow: hidden;
    border: 2px solid #bd9146;
    box-shadow: 0 0 15px #c28a32, 0 0 35px rgba(189,145,70,.25);
    background: #17100c;
}

.lado img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
}

.frente {
    transform: rotateY(180deg);
}

/* BOTÃO */

.botao {
    display: inline-block;
    border: 1px solid #d5a84f;
    padding: 13px 30px;
    border-radius: 30px;
    color: #ffe2a2;
    background: linear-gradient(135deg, #75451c, #241309);
    font-size: 16px;
    font-family: Georgia, serif;
    cursor: pointer;
    box-shadow: 0 0 15px rgba(215,167,74,.25);
    transition: .3s;
}

.botao:hover {
    background: linear-gradient(135deg, #a66c29, #4b260e);
    box-shadow: 0 0 22px #b77a24;
    transform: scale(1.04);
}

/* RESULTADO */

.resultado {
    display: none;
    margin: 28px auto 0;
    padding: 25px 20px;
    border: 1px solid rgba(212,169,91,.65);
    border-radius: 14px;
    background: rgba(24,14,9,.85);
    box-shadow: 0 0 25px rgba(192,133,43,.15);
    animation: aparecer 1s ease;
}

.resultado h2 {
    color: #e8bd62;
    font-size: 30px;
    margin-bottom: 17px;
    text-transform: uppercase;
    letter-spacing: 2px;
}

.resultado .mensagem {
    color: #fff0d0;
    font-size: 18px;
    line-height: 1.8;
    margin-bottom: 20px;
}

.conselho {
    border-top: 1px solid #92703b;
    padding-top: 18px;
    color: #eac779;
    font-size: 18px;
    line-height: 1.8;
}

.conselho strong {
    display: block;
    margin-bottom: 8px;
    font-size: 19px;
}

.data {
    font-size: 13px;
    color: #bda77f;
    margin-top: 20px;
}

/* HORÓSCOPO VIRTUAL */

#widget-horoscopo {
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 0 auto 18px;
    padding: 0 12px;
    text-align: center;
}

/* RODAPÉ */

footer {
    padding: 25px 15px;
    color: #a68a5e;
    font-size: 13px;
    letter-spacing: 1px;
}

@keyframes aparecer {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* CELULAR */

@media(max-width: 480px) {
    header {
        padding: 22px 12px 5px;
    }

    header h1 {
        font-size: clamp(24px, 7vw, 34px);
        letter-spacing: 2px;
        line-height: 1.25;
    }

    header .subtitulo {
        font-size: 16px;
        letter-spacing: 3px;
        margin-top: 8px;
    }

    .linha {
        margin: 14px auto;
        width: 145px;
    }

    .container {
        padding: 5px 14px 30px;
    }

    .instrucao {
        font-size: 15px;
        margin: 8px 0 18px;
    }

    .area-carta {
        width: min(58vw, 205px);
        height: min(85vw, 315px);
        max-height: 315px;
        margin-bottom: 20px;
    }

    .resultado {
        padding: 20px 15px;
    }

    .resultado h2 {
        font-size: 25px;
    }

    .resultado .mensagem,
    .conselho {
        font-size: 16px;
    }
}
</style>
</head>

/* ===================================
   SORTEIO DIÁRIO
=================================== */

const chaveData = "portalMagoData";
const chaveCarta = "portalMagoCarta";
const chaveHistorico = "portalMagoHistorico";
const chaveConselho = "portalMagoConselho";

let cartaDoDia;
let conselhoDoDia;
let revelada = false;


/* DATA LOCAL */

function dataAtual() {

    const agora = new Date();

    const ano = agora.getFullYear();
    const mes = String(agora.getMonth() + 1).padStart(2, "0");
    const dia = String(agora.getDate()).padStart(2, "0");

    return `${ano}-${mes}-${dia}`;
}


/* ESCOLHER UMA CARTA */

function sortearCarta() {

    let historico = [];

    try {
        historico = JSON.parse(
            localStorage.getItem(chaveHistorico)
        ) || [];
    } catch(e) {
        historico = [];
    }

    let disponiveis = cartas.filter(
        carta => !historico.includes(carta.arquivo)
    );

    if (disponiveis.length === 0) {
        historico = [];
        disponiveis = [...cartas];
    }

    const indice = Math.floor(
        Math.random() * disponiveis.length
    );

    const escolhida = disponiveis[indice];

    historico.push(escolhida.arquivo);

    localStorage.setItem(
        chaveHistorico,
        JSON.stringify(historico)
    );

    return escolhida;
}


/* ===================================
   SORTEAR UM DOS 3 CONSELHOS
=================================== */

function sortearConselho(carta) {

    const indice = Math.floor(
        Math.random() * carta.conselhos.length
    );

    return carta.conselhos[indice];
}


/* ===================================
   CARREGAR CARTA E CONSELHO DO DIA
=================================== */

function carregarCartaDoDia() {

    const hoje = dataAtual();

    const dataSalva = localStorage.getItem(chaveData);
    const cartaSalva = localStorage.getItem(chaveCarta);
    const conselhoSalvo = localStorage.getItem(chaveConselho);

    /* Se já existe sorteio de hoje, mantém */

    if (dataSalva === hoje && cartaSalva) {

        cartaDoDia = cartas.find(
            c => c.arquivo === cartaSalva
        );

        if (cartaDoDia) {

            conselhoDoDia = cartaDoDia.conselhos.includes(conselhoSalvo)
                ? conselhoSalvo
                : sortearConselho(cartaDoDia);

        }

    }

    /* Se ainda não existe sorteio de hoje, cria um novo */

    if (!cartaDoDia) {

        cartaDoDia = sortearCarta();

        conselhoDoDia = sortearConselho(cartaDoDia);

        localStorage.setItem(chaveData, hoje);

        localStorage.setItem(
            chaveCarta,
            cartaDoDia.arquivo
        );

    }

    /* Garante que exista um conselho */

    if (!conselhoDoDia) {
        conselhoDoDia = sortearConselho(cartaDoDia);
    }

    /* Salva o conselho escolhido para o dia */

    localStorage.setItem(
        chaveConselho,
        conselhoDoDia
    );

}


/* ===================================
   CARREGAMENTO DE IMAGENS
=================================== */

function carregarImagem(elemento, nome) {

    let tentativa = 0;

    function tentar() {

        if (tentativa >= extensoes.length) {

            elemento.alt = "Imagem não encontrada: " + nome;

            console.error(
                "Imagem não encontrada:",
                nome
            );

            return;
        }

        elemento.src =
            pastaCartas +
            nome +
            extensoes[tentativa];

        tentativa++;

    }

    elemento.onerror = tentar;

    tentar();

}


/* ===================================
   REVELAR CARTA
=================================== */

function revelarCarta() {

    if (revelada) return;

    revelada = true;

    document.getElementById("carta")
        .classList.add("virada");

    document.getElementById("instrucao")
        .textContent = "A mensagem da sua carta de hoje:";

    document.getElementById("botao")
        .style.display = "none";

    document.getElementById("areaCarta")
        .style.cursor = "default";

    document.getElementById("nomeCarta")
        .textContent = cartaDoDia.nome;

    document.getElementById("mensagem")
        .textContent = cartaDoDia.mensagem;

    /* MOSTRA O CONSELHO ALEATÓRIO ESCOLHIDO */

    document.getElementById("conselho")
        .textContent = conselhoDoDia;

    document.getElementById("data")
        .textContent =
        "Carta sorteada em " +
        new Date().toLocaleDateString("pt-BR");

    setTimeout(() => {

        document.getElementById("resultado")
            .style.display = "block";

        document.getElementById("resultado")
            .scrollIntoView({
                behavior: "smooth",
                block: "nearest"
            });

    }, 700);

}


/* ===================================
   INICIALIZAÇÃO
=================================== */

function iniciarPortal() {

    carregarCartaDoDia();

    /* Mostra o verso da carta */

    carregarImagem(
        document.getElementById("imagemVerso"),
        "back"
    );

    /* Prepara a carta sorteada */

    carregarImagem(
        document.getElementById("imagemFrente"),
        cartaDoDia.arquivo
    );

}

iniciarPortal();

</script>
