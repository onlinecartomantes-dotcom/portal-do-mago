<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#100b0b">

<title>PORTAL DO MAGO | Carta do Dia</title>
<meta name="description" content="Portal do Mago - Descubra sua carta do dia e receba uma mensagem e um conselho especial.">

<style>
:root {
    --ouro: #e8bd62;
    --ouro-escuro: #bd9146;
    --texto: #f5dfaa;
    --fundo: #080707;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    min-height: 100vh;
    min-height: 100svh;
    background: radial-gradient(
        ellipse at top,
        #38200f 0%,
        #160e0b 45%,
        #080707 100%
    );
    color: var(--texto);
    font-family: Georgia, 'Times New Roman', serif;
    text-align: center;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
}

/* CABEÇALHO */

header {
    width: 100%;
    padding: clamp(20px, 4vh, 34px) 14px 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
}

header h1 {
    width: 100%;
    max-width: 680px;
    color: var(--ouro);
    font-size: clamp(21px, 6vw, 43px);
    line-height: 1.15;
    letter-spacing: clamp(1px, .55vw, 3px);
    white-space: nowrap;
    text-align: center;
    text-shadow: 0 0 13px rgba(183,122,36,.65);
}

header .subtitulo {
    margin-top: 10px;
    font-size: clamp(14px, 3.8vw, 22px);
    line-height: 1.3;
    letter-spacing: clamp(2px, .8vw, 4px);
    color: #fff0c5;
    text-align: center;
}

.linha {
    width: min(150px, 45vw);
    height: 1px;
    background: linear-gradient(
        to right,
        transparent,
        #d6a54e,
        transparent
    );
    margin: 17px auto 8px;
}

/* CONTEÚDO */

.container {
    width: 100%;
    max-width: 700px;
    margin: 0 auto;
    padding: 8px 18px 32px;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.instrucao {
    width: 100%;
    max-width: 540px;
    font-size: clamp(14px, 3.7vw, 17px);
    color: #e6c98f;
    margin: 8px auto 18px;
    line-height: 1.55;
    text-align: center;
}

/* CARTA RESPONSIVA */

.area-carta {
    perspective: 1200px;
    width: clamp(190px, 62vw, 270px);
    aspect-ratio: 2 / 3;
    height: auto;
    margin: 0 auto 20px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    flex: 0 0 auto;
}

.carta {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transition: transform 1s ease;
}

.carta.virada {
    transform: rotateY(180deg);
}

.lado {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border-radius: 12px;
    overflow: hidden;
    border: 2px solid var(--ouro-escuro);
    box-shadow:
        0 0 13px rgba(194,138,50,.75),
        0 0 30px rgba(189,145,70,.22);
    background: #17100c;
}

.lado img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
}

.frente {
    transform: rotateY(180deg);
}

/* BOTÃO */

.botao {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    max-width: 100%;
    border: 1px solid #d5a84f;
    padding: 12px 24px;
    border-radius: 30px;
    color: #ffe2a2;
    background: linear-gradient(135deg, #75451c, #241309);
    font-size: clamp(13px, 3.5vw, 16px);
    font-family: Georgia, serif;
    cursor: pointer;
    box-shadow: 0 0 15px rgba(215,167,74,.25);
    transition: .3s;
    -webkit-tap-highlight-color: transparent;
}

.botao:hover {
    background: linear-gradient(135deg, #a66c29, #4b260e);
    box-shadow: 0 0 22px #b77a24;
    transform: scale(1.03);
}

/* RESULTADO */

.resultado {
    display: none;
    width: 100%;
    margin: 24px auto 0;
    padding: 23px 20px;
    border: 1px solid rgba(212,169,91,.65);
    border-radius: 14px;
    background: rgba(24,14,9,.88);
    box-shadow: 0 0 25px rgba(192,133,43,.15);
    animation: aparecer 1s ease;
    text-align: center;
}

.resultado h2 {
    color: var(--ouro);
    font-size: clamp(23px, 6vw, 30px);
    line-height: 1.2;
    margin-bottom: 14px;
    text-transform: uppercase;
    letter-spacing: 2px;
    text-align: center;
}

.resultado .mensagem {
    color: #fff0d0;
    font-size: clamp(15px, 3.8vw, 18px);
    line-height: 1.75;
    margin-bottom: 18px;
    text-align: center;
}

.conselho {
    border-top: 1px solid #92703b;
    padding-top: 16px;
    color: #eac779;
    font-size: clamp(15px, 3.8vw, 18px);
    line-height: 1.75;
    text-align: center;
}

.conselho strong {
    display: block;
    margin-bottom: 8px;
    font-size: clamp(16px, 4vw, 19px);
    text-align: center;
}

.data {
    font-size: 12px;
    color: #bda77f;
    margin-top: 17px;
    text-align: center;
}

/* HORÓSCOPO VIRTUAL */

#widget-horoscopo {
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 0 auto 12px;
    padding: 0 10px;
    text-align: center;
    overflow: hidden;
}

/* RODAPÉ */

footer {
    padding: 20px 15px 26px;
    color: #a68a5e;
    font-size: 12px;
    letter-spacing: 1px;
    text-align: center;
}

/* ANIMAÇÃO */

@keyframes aparecer {
    from {
        opacity: 0;
        transform: translateY(16px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* CELULARES PEQUENOS */

@media (max-width: 380px) {

    header {
        padding-top: 18px;
    }

    header h1 {
        font-size: clamp(19px, 5.8vw, 22px);
        letter-spacing: 1px;
    }

    header .subtitulo {
        margin-top: 8px;
        font-size: 14px;
    }

    .linha {
        margin: 13px auto 5px;
    }

    .container {
        padding: 6px 13px 26px;
    }

    .instrucao {
        margin: 7px auto 15px;
        font-size: 14px;
    }

    .area-carta {
        width: min(61vw, 225px);
        margin-bottom: 17px;
    }

    .resultado {
        padding: 19px 14px;
    }
}

/* TABLETS E COMPUTADORES */

@media (min-width: 700px) {

    header {
        padding-top: 35px;
    }

    .container {
        padding-top: 14px;
    }

    .area-carta {
        width: 260px;
    }
}

/* REDUZ MOVIMENTO */

@media (prefers-reduced-motion: reduce) {

    *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
    }
}

</style>
</head>

/* ===================================
   SORTEIO DIÁRIO
=================================== */

const chaveData = "portalMagoData";
const chaveCarta = "portalMagoCarta";
const chaveHistorico = "portalMagoHistorico";

let cartaDoDia;
let revelada = false;


/* DATA LOCAL */

function dataAtual() {

    const agora = new Date();

    const ano = agora.getFullYear();
    const mes = String(agora.getMonth() + 1).padStart(2, "0");
    const dia = String(agora.getDate()).padStart(2, "0");

    return `${ano}-${mes}-${dia}`;
}


/* ESCOLHER UMA CARTA */

function sortearCarta() {

    let historico = [];

    try {
        historico = JSON.parse(
            localStorage.getItem(chaveHistorico)
        ) || [];
    } catch(e) {
        historico = [];
    }

    /* Evita repetição até completar as 36 */

    let disponiveis = cartas.filter(
        carta => !historico.includes(carta.arquivo)
    );

    /* Quando todas saírem, começa novo ciclo */

    if (disponiveis.length === 0) {
        historico = [];
        disponiveis = [...cartas];
    }

    const indice = Math.floor(
        Math.random() * disponiveis.length
    );

    const escolhida = disponiveis[indice];

    historico.push(escolhida.arquivo);

    localStorage.setItem(
        chaveHistorico,
        JSON.stringify(historico)
    );

    return escolhida;
}


/* CARREGAR A CARTA DO DIA */

function carregarCartaDoDia() {

    const hoje = dataAtual();

    const dataSalva = localStorage.getItem(chaveData);
    const cartaSalva = localStorage.getItem(chaveCarta);

    if (dataSalva === hoje && cartaSalva) {

        cartaDoDia = cartas.find(
            c => c.arquivo === cartaSalva
        );

    }

    if (!cartaDoDia) {

        cartaDoDia = sortearCarta();

        localStorage.setItem(chaveData, hoje);

        localStorage.setItem(
            chaveCarta,
            cartaDoDia.arquivo
        );

    }

}


/* ===================================
   CARREGAMENTO DE IMAGENS
=================================== */

function carregarImagem(elemento, nome) {

    let tentativa = 0;

    function tentar() {

        if (tentativa >= extensoes.length) {

            elemento.alt = "Imagem não encontrada: " + nome;

            console.error(
                "Imagem não encontrada:",
                nome
            );

            return;
        }

        elemento.src =
            pastaCartas +
            nome +
            extensoes[tentativa];

        tentativa++;

    }

    elemento.onerror = tentar;

    tentar();

}


/* ===================================
   REVELAR CARTA
=================================== */

function revelarCarta() {

    if (revelada) return;

    revelada = true;

    document.getElementById("carta")
        .classList.add("virada");

    document.getElementById("instrucao")
        .textContent = "A mensagem da sua carta de hoje:";

    document.getElementById("botao")
        .style.display = "none";

    document.getElementById("areaCarta")
        .style.cursor = "default";

    document.getElementById("nomeCarta")
        .textContent = cartaDoDia.nome;

    document.getElementById("mensagem")
        .textContent = cartaDoDia.mensagem;

    document.getElementById("conselho")
        .textContent = cartaDoDia.conselho;

    document.getElementById("data")
        .textContent =
        "Carta sorteada em " +
        new Date().toLocaleDateString("pt-BR");

    setTimeout(() => {

        document.getElementById("resultado")
            .style.display = "block";

        document.getElementById("resultado")
            .scrollIntoView({
                behavior: "smooth",
                block: "nearest"
            });

    }, 700);

}


/* ===================================
   INICIALIZAÇÃO
=================================== */

function iniciarPortal() {

    carregarCartaDoDia();

    /* Mostra o verso */

    carregarImagem(
        document.getElementById("imagemVerso"),
        "back"
    );

    /* Prepara a carta sorteada */

    carregarImagem(
        document.getElementById("imagemFrente"),
        cartaDoDia.arquivo
    );

}

iniciarPortal();

</script>
